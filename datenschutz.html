<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenschutz - Jakob Moussa</title>

    <link rel="stylesheet" href="css/stlye.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/legal.css">
    <link rel="stylesheet" href="css/contact-footer.css">
    <link rel="icon" href="assets/images/jm-icon.png">
</head>

<body>

    <header class="hero-header">
        <div class="logo">
            <a href="index.html"><img src="assets/images/Jakob.svg" alt="Logo"></a>
        </div>
        <div class="right-nav">
            <nav class="nav">
                <a href="index.html#about-section" data-translate="navAbout">About me</a>
                <a href="index.html#skills-section" data-translate="navSkills">Skills</a>
                <a href="index.html#portfolio-section" data-translate="navPortfolio">Portfolio</a>
                <a href="index.html#contact" data-translate="navContact">contact</a>
            </nav>
            <div class="language-switch">
                <button>DE</button>
                <button class="active">EN</button>
            </div>
        </div>
    </header>
    <div class="back-arrow-container">
        <a href="index.html">
            <img src="assets/images/4. Go-up-button.png" alt="back-arrow">
        </a>
    </div>

    <section class="legal-section">

        <div class="legal-container">
            <div class="legal-headline-container">
                <span class="line"></span>
                <h1 class="legal-headline" data-translate="datenschutzTitle">Privacy Policy</h1>
                <span class="before-line"></span>
            </div>

            <div class="legal-content" data-translate="datenschutzContent">
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-logo">
                    <span><img class="jakob-image" src="assets/images/Jakob.svg" alt="jakob"></span>
                </div>
                <p class="footer-legal">
                    <a class="impressum" href="impressum.html" data-translate="legalNoticeLink">Legal Notice</a> | <a
                        class="datenschutz" href="datenschutz.html" data-translate="privacyPolicyLink">Privacy
                        Policy</a>
                </p>
            </div>

            <div class="footer-center">
                <p class="footer-copyright">© Jakob Moussa 2026</p>
            </div>

            <div class="footer-right">
                <div class="footer-social">
                    <a href="https://github.com/JakobMoussa" target="_blank" rel="noopener noreferrer"
                        aria-label="GitHub"><img src="assets/images/icons/github.svg" alt="GitHub"></a>
                    <a href="mailto:contact@jakobmoussa.de" aria-label="Email"><img
                            src="assets/images/icons/Email button.svg" alt="Email"></a>
                    <a href="https://www.linkedin.com/in/jakob-moussa/" target="_blank" rel="noopener noreferrer"
                        aria-label="LinkedIn"><img src="assets/images/icons/Linkedin button.svg" alt="LinkedIn"></a>
                </div>
            </div>
        </div>
    </footer>
    <script src="./js/translations.js"></script>
</body>

</html>
